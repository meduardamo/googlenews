name: 📰 Monitor de Notícias - Google News

on:
  schedule:
    # Executa a cada 6 horas (mais eficiente para monitoramento)
    - cron: '0 */6 * * *'  # 00:00, 06:00, 12:00, 18:00 UTC
  workflow_dispatch:  # Permite execução manual
    inputs:
      periodo_dias:
        description: 'Período em dias para buscar notícias'
        required: false
        default: '7'
        type: string
      debug_mode:
        description: 'Ativar modo debug'
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'scraper.py'
      - '.github/workflows/news-scraper.yml'

env:
  PYTHONUNBUFFERED: 1
  PYTHONIOENCODING: utf-8

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Timeout para evitar execuções travadas
    
    steps:
    - name: 📥 Checkout do código
      uses: actions/checkout@v4

    - name: 🐍 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 📋 Cache de dependências Python
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: 📦 Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: 🌐 Setup Chrome
      uses: browser-actions/setup-chrome@v1
      with:
        chrome-version: stable

    - name: 🔧 Configurar ambiente virtual (Selenium)
      run: |
        export DISPLAY=:99
        Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
        sleep 3

    - name: 🧪 Teste de conectividade
      if: ${{ inputs.debug_mode == 'true' }}
      run: |
        echo "🌐 Testando conectividade..."
        curl -I https://news.google.com/ || echo "⚠️ Problema de conectividade detectado"
        python -c "import selenium; print(f'✅ Selenium versão: {selenium.__version__}')"

    - name: 🚀 Executar scraper de notícias
      env:
        GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
        PERIODO_DIAS: ${{ inputs.periodo_dias || '7' }}
        DEBUG_MODE: ${{ inputs.debug_mode || 'false' }}
      run: |
        echo "🎯 Iniciando coleta de notícias..."
        echo "📅 Período: últimos $PERIODO_DIAS dias"
        python scraper.py
      continue-on-error: false

    - name: 📊 Relatório de execução
      if: always()
      run: |
        echo "📋 RELATÓRIO DE EXECUÇÃO"
        echo "=========================="
        echo "🕒 Execução finalizada em: $(date -u '+%d/%m/%Y %H:%M:%S') UTC"
        echo "🌍 Timezone: $(date '+%Z %z')"
        echo "💾 Uso de memória:"
        free -h || echo "Informação de memória não disponível"
        echo "💿 Espaço em disco:"
        df -h / || echo "Informação de disco não disponível"

    - name: 🔍 Debug - Listar arquivos gerados
      if: ${{ inputs.debug_mode == 'true' }}
      run: |
        echo "📁 Arquivos no diretório:"
        ls -la
        echo "📄 Logs do sistema:"
        journalctl --since="1 hour ago" --no-pager | tail -20 || echo "Logs não disponíveis"

    - name: ⚠️ Notificação de falha
      if: failure()
      run: |
        echo "❌ EXECUÇÃO FALHOU"
        echo "Por favor, verifique os logs acima para identificar o problema."
        echo "Problemas comuns:"
        echo "- Credenciais do Google Sheets inválidas"
        echo "- Rate limiting do Google News"
        echo "- Problemas de conectividade"
        echo "- Timeout na execução"

    - name: 🎉 Notificação de sucesso
      if: success()
      run: |
        echo "✅ EXECUÇÃO CONCLUÍDA COM SUCESSO"
        echo "📊 Dados atualizados no Google Sheets"
        echo "🔗 Acesse: https://docs.google.com/spreadsheets/d/1G81BndSPpnViMDxRKQCth8PwK0xmAwH-w-T7FjgnwcY"

  # Job opcional para monitoramento de saúde
  health-check:
    runs-on: ubuntu-latest
    needs: scrape-news
    if: always()
    steps:
    - name: 🏥 Health Check
      run: |
        if [ "${{ needs.scrape-news.result }}" == "success" ]; then
          echo "✅ Sistema funcionando normalmente"
          echo "📈 Próxima execução programada em 6 horas"
        else
          echo "⚠️ Detectado problema na execução"
          echo "🔄 Sistema tentará novamente na próxima execução programada"
        fi
