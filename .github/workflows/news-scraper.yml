name: Raspagem Google News (Sheets + Email) — cred no repo

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC (~08:00 America/Recife)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: America/Recife
      PLANILHA: ${{ secrets.PLANILHA }}                 # key da planilha
      ABA: "google notícias"                            # se tiver espaço, deixe entre aspas
      EMAIL: ${{ secrets.EMAIL }}                       # remetente (Brevo)
      DESTINATARIOS: ${{ secrets.DESTINATARIOS }}       # "a@b.com,c@d.com"
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}       # chave do Brevo
      WDM_LOG_LEVEL: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Chrome version
        run: |
          google-chrome --version || true
          which google-chrome || true

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        run: |
          python NEWS_GOOGLE.py

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: noticias_PNE_Planos_Educacao
          path: noticias_PNE_Planos_Educacao.xlsx
          if-no-files-found: error
