name: Raspagem Google News (Sheets + Email)

on:
  schedule:
    - cron: '0 11 * * *'   # 11:00 UTC (~08:00 America/Recife)
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: America/Recife
      # variáveis usadas pelo scraper.py
      PLANILHA: ${{ secrets.PLANILHA }}                 # key da planilha (ex: 1G81BndS...gnwcY)
      ABA: "google notícias"                            # nome da worksheet; aspas pq tem espaço
      EMAIL: ${{ secrets.EMAIL }}                       # remetente cadastrado no Brevo
      DESTINATARIOS: ${{ secrets.DESTINATARIOS }}       # lista separada por vírgula
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}       # API key do Brevo
      # Se seu scraper também lê este secret para criar o arquivo, mantemos disponível:
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      WDM_LOG_LEVEL: "0"                                # menos ruído do webdriver_manager

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Chrome version
        run: |
          google-chrome --version || true
          which google-chrome || true

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials.json from secret
        shell: bash
        run: |
          if [ -n "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" ]; then
            printf '%s' "${GOOGLE_APPLICATION_CREDENTIALS_JSON}" > credentials.json
            echo "credentials.json criado com $(wc -c < credentials.json) bytes"
          elif [ -n "${GCP_SERVICE_ACCOUNT_JSON}" ]; then
            printf '%s' "${GCP_SERVICE_ACCOUNT_JSON}" > credentials.json
            echo "credentials.json criado (via GCP_SERVICE_ACCOUNT_JSON) com $(wc -c < credentials.json) bytes"
          else
            echo "ERRO: nenhum secret de credenciais encontrado (GOOGLE_APPLICATION_CREDENTIALS_JSON ou GCP_SERVICE_ACCOUNT_JSON)."
            exit 1
          fi

      - name: Run scraper
        run: |
          python scraper.py

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: noticias_PNE_Planos_Educacao
          path: noticias_PNE_Planos_Educacao.xlsx
          if-no-files-found: error
