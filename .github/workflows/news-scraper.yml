name: News scraper (PNE / Google News)

on:
  workflow_dispatch: {}
  schedule:
    # roda todo dia às 11:00 UTC (08:00 America/Recife)
    - cron: "0 11 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: America/Recife
      # Passe o secret com o JSON (bruto, string JSON ou base64).
      # O scraper.py já lida com qualquer um desses formatos e também
      # consegue criar o arquivo caso ele não exista.
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      WDM_LOG_LEVEL: "0" # menos ruído do webdriver_manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Chrome version
        run: |
          google-chrome --version || true
          which google-chrome || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Opcional: gravar o credentials.json a partir do secret (sem validação inline)
      # Se preferir, pode remover este passo — o scraper.py já cria o arquivo se não existir.
      - name: Write credentials.json from secret (optional)
        shell: bash
        run: |
          if [ -n "${GCP_SERVICE_ACCOUNT_JSON}" ]; then
            # grava exatamente o conteúdo do secret (mantém \n corretamente)
            printf '%s' "${GCP_SERVICE_ACCOUNT_JSON}" > credentials.json
            echo "credentials.json escrito com $(wc -c < credentials.json) bytes"
          else
            echo "GCP_SERVICE_ACCOUNT_JSON não definido; o scraper.py vai tentar criar o arquivo."
          fi

      - name: Run scraper
        run: |
          python scraper.py

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: noticias_PNE_Planos_Educacao
          path: noticias_PNE_Planos_Educacao.xlsx
          if-no-files-found: error
