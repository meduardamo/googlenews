name: Coletor de Notícias

on:
  schedule:
    - cron: "0 8 * * *"   # 05:00 BRT
    - cron: "0 10 * * *"  # 07:00 BRT
    - cron: "0 12 * * *"  # 09:00 BRT
    - cron: "0 15 * * *"  # 12:00 BRT
    - cron: "0 17 * * *"  # 14:00 BRT
    - cron: "0 20 * * *"  # 17:00 BRT
    - cron: "0 2 * * *"   # 23:00 BRT
    - cron: "0 4 * * *"   # 01:00 BRT
  workflow_dispatch: {}

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ_OFFSET_HOURS: "-3"
      EXTRACT_BODY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          try:
              import nltk
              nltk.download('punkt', quiet=True)
          except Exception:
              pass
          PY

      - name: Write service account key
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT_JSON" > credentials.json

      - name: Run scraper (GoogleNews → Sheets)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          SPREADSHEET_ID: ${{ secrets.PLANILHA }}
          TZ_OFFSET_HOURS: ${{ env.TZ_OFFSET_HOURS }}
          EXTRACT_BODY: ${{ env.EXTRACT_BODY }}
        run: |
          python scraper.py

      - name: Run alignment
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          PLANILHA: ${{ secrets.PLANILHA }}
          GENAI_API_KEY: ${{ secrets.GENAI_API_KEY }}
          # tuning opcional:
          # GENAI_MODEL: "gemini-2.0-flash"
          # ALIGN_BATCH_SIZE: "20"
          # ALIGN_SLEEP_SEC: "0"
          # ALIGN_READ_RANGE: "A1:Z5000"
        run: |
          python alinhamento.py
