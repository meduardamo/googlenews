name: Scraper Google Notícias

on:
  schedule:
    # executa a cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scraper.py'
      - '.github/workflows/news-scraper.yml'

jobs:
  scrape-news:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Dependências
        run: |
          pip install --upgrade pip
          pip install pandas selenium beautifulsoup4 gspread gspread-dataframe google-auth webdriver-manager requests

      - name: 🌐 Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 🖥️ Xvfb
        run: |
          export DISPLAY=:99
          Xvfb :99 -screen 0 1920x1080x24 &

      - name: 🚀 Rodar scraper
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
          SPREADSHEET_KEY: ${{ secrets.SPREADSHEET_KEY }}
        run: |
          python scraper.py
