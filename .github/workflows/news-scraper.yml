name: GoogleNews → Sheets

on:
  schedule:
    - cron: "0 10 * * *"  # 07h BRT
    - cron: "0 12 * * *"  # 09h BRT
    - cron: "0 15 * * *"  # 12h BRT
    - cron: "0 17 * * *"  # 14h BRT
    - cron: "0 20 * * *"  # 17h BRT
  workflow_dispatch: {}

concurrency:
  group: news-scraper
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ_OFFSET_HOURS: "-3"
      EXTRACT_BODY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          try:
              import nltk
              nltk.download('punkt', quiet=True)
          except Exception:
              pass
          PY

      - name: Write service account key
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT_JSON" > credentials.json

      - name: Run scraper
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          SPREADSHEET_ID: ${{ secrets.PLANILHA }}
          TZ_OFFSET_HOURS: ${{ env.TZ_OFFSET_HOURS }}
          EXTRACT_BODY: ${{ env.EXTRACT_BODY }}
        run: |
          python scraper.py
