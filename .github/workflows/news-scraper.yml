name: News scraper (PNE / Google News)

on:
  workflow_dispatch: {}
  schedule:
    # roda todo dia às 11:00 UTC (08:00 America/Recife)
    - cron: "0 11 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ: America/Recife
      # Secret com o JSON (bruto, string JSON ou base64). O script lida com todos.
      GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
      WDM_LOG_LEVEL: "0" # menos ruído do webdriver_manager

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Show Chrome version
        run: |
          google-chrome --version || true
          which google-chrome || true

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Grava o credentials.json a partir do secret e faz uma checagem básica
      - name: Write credentials.json from secret
        shell: bash
        run: |
          cat > credentials.json << 'EOF'
          ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          EOF
          echo "credentials.json escrito com $(wc -c < credentials.json) bytes"
          python - << 'PY'
import json
with open('credentials.json','r',encoding='utf-8') as f:
    data = json.load(f)
print("keys:", sorted(k for k in data.keys() if k in ('type','project_id','client_email','client_id')))
PY

      - name: Run scraper
        run: |
          python scraper.py

      - name: Upload Excel artifact
        uses: actions/upload-artifact@v4
        with:
          name: noticias_PNE_Planos_Educacao
          path: noticias_PNE_Planos_Educacao.xlsx
          if-no-files-found: error
