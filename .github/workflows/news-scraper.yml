name: Coletor de Notícias

on:
  schedule:
    - cron: "38 11 * * *"  # 08:38 BRT
    - cron: "38 15 * * *"  # 12:38 BRT
    - cron: "38 17 * * *"  # 14:38 BRT
    - cron: "38 20 * * *"  # 17:38 BRT
    - cron: "38 2 * * *"   # 23:38 BRT
    - cron: "38 4 * * *"   # 01:38 BRT
  workflow_dispatch: {}

concurrency:
  group: news-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ_OFFSET_HOURS: "-3"
      EXTRACT_BODY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python - <<'PY'
          try:
              import nltk
              nltk.download('punkt', quiet=True)
          except Exception:
              pass
          PY

      - name: Write service account key
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GCP_SERVICE_ACCOUNT_JSON" > credentials.json

      - name: Run scraper (GoogleNews → Sheets)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          SPREADSHEET_ID: ${{ secrets.PLANILHA }}
          TZ_OFFSET_HOURS: ${{ env.TZ_OFFSET_HOURS }}
          EXTRACT_BODY: ${{ env.EXTRACT_BODY }}
        run: |
          python scraper.py

      - name: Run alignment
        env:
          GOOGLE_APPLICATION_CREDENTIALS: credentials.json
          PLANILHA: ${{ secrets.PLANILHA }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python alinhamento.py
