name: Coletor de Notícias (Subnacional)

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"
    - cron: "0 12 * * *"
    - cron: "0 15 * * *"
    - cron: "0 17 * * *"
    - cron: "0 20 * * *"
    - cron: "0 2 * * *"
    - cron: "0 4 * * *"
  workflow_dispatch: {}

concurrency:
  group: news-pipeline-subnacional
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TZ_OFFSET_HOURS: "-3"
      APENAS_HOJE: "1"
      MAX_PER_DOMAIN: "100"
      PAUSA_ENTRE_DOMINIOS: "0.2"

      BATCH_INSERT_SIZE: "50"
      PAUSA_BETWEEN_BATCH_WRITES: "2.5"
      PAUSA_BETWEEN_WS: "1.0"

      ABA_ENTRADA: "deduplicado"
      COL_LINK: "Link"
      COL_ESTADO: "Estado"

      WRITE_CONSOLIDADO: "0"
      ABA_CONSOLIDADO: "links_com_estado_monitoramento"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper (GoogleNews → Sheets)
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          PLANILHA_SUBNACIONAL: ${{ secrets.PLANILHA_SUBNACIONAL }}
        run: |
          python scraper_subnacional.py
